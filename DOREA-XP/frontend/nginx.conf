server {
    listen 80;

    # Docker 내부 DNS — 백엔드 재시작 시 IP 재해석
    resolver 127.0.0.11 valid=10s;

    # 업로드 용량 제한 100MB
    client_max_body_size 100m;

    include /etc/nginx/mime.types;
    types {
        text/javascript js mjs;
    }

    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1260s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;

        # SSE specific headers
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    location /docs {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /redoc {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /openapi.json {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── rhwp-studio same-origin proxy ───────────────────────────
    # The editor iframe loads from /rhwp/ so browser clipboard, postMessage,
    # and storage stay under the DOREA-XP origin (avoids cross-origin gotchas).
    location /rhwp/ {
        set $rhwp_upstream http://rhwp-service:7700;
        proxy_pass $rhwp_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;

        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-cache";
    }

    # /rhwp-api/* → rhwp-service /api/* (blank-document, document-from-text, ...)
    location /rhwp-api/ {
        set $rhwp_upstream http://rhwp-service:7700;
        rewrite ^/rhwp-api/(.*)$ /api/$1 break;
        proxy_pass $rhwp_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-cache";
    }

    # Ensure ES module workers served with correct MIME
    location ~* \.mjs$ {
        default_type text/javascript;
        add_header Content-Type 'text/javascript' always;
        add_header Cache-Control 'no-store' always;
        try_files $uri =404;
    }


    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
